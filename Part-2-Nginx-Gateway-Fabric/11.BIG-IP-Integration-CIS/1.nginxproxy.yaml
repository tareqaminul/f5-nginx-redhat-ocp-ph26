# Data plane settings for THIS Gateway only.
# Not optional: it provides the three things the BIG-IP integration depends on.
#
#   1. service.type NodePort      -> CIS (pool_member_type=nodeport) can build pool members
#   2. readinessProbe.expose      -> CIS can health check them on a real readiness endpoint
#   3. rewriteClientIP            -> the PROXY protocol header from the iRule is honoured
#
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: gatewaylink-proxy
  namespace: gatewaylink-demo       # must be the GATEWAY's namespace
spec:
  rewriteClientIP:
    mode: ProxyProtocol
    trustedAddresses:
    # NGINX validates trust against the address the connection COMES FROM.
    # With externalTrafficPolicy: Cluster the node SNATs to an OVN-Kubernetes
    # join-subnet address (100.64.0.0/16 by default) - NOT the BIG-IP self-IP.
    # So either trust both, or use externalTrafficPolicy: Local (see below).
    - type: CIDR
      value: 10.1.10.250/32         # <-- BIG-IP self-IP / source of traffic
    - type: CIDR
      value: 100.64.0.0/16          # <-- OVN-K join subnet (drop this if you use eTP Local)
  kubernetes:
    service:
      type: NodePort                # MUST match CIS args.pool_member_type
      externalTrafficPolicy: Cluster
      # Local  = no SNAT (NGINX sees the BIG-IP self-IP, so the /32 above is enough)
      #          but only nodes running a data plane pod answer -> run >= 2 replicas
      # Cluster= all nodes answer, at the cost of SNAT and a possible extra hop
    deployment:
      replicas: 2
      container:
        readinessProbe:
          expose: true              # exposes port 8081 on the Service, with its own nodePort
          port: 8081
          path: /nginx-ready
