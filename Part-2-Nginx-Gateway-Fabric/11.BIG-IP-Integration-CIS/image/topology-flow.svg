<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img"
     aria-label="GatewayLink on OpenShift: an ExternalLoadBalancer targets a Gateway, an NginxProxy sets the data plane to NodePort with PROXY protocol, NGF emits an IngressLink, F5 CIS compiles an AS3 declaration and BIG-IP serves the virtual server whose pool members are the node ports of the data plane Service" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { color-scheme: light dark; }
    .bg     { fill: #ffffff; }
    .frame  { fill: none; stroke: #d7dbe0; stroke-width: 1; }
    .col    { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #6b7280; letter-spacing: .08em; }
    .title  { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #111827; }
    .body   { font: 11.5px ui-sans-serif, system-ui, sans-serif; fill: #374151; }
    .edge   { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
    .k8s    { fill: #e8eefc; stroke: #9db4e8; }
    .dp     { fill: #fdf0dc; stroke: #e3bc80; }
    .cis    { fill: #e4f3f1; stroke: #8dc4bc; }
    .bigip  { fill: #eceef1; stroke: #b9c0c9; }
    .flow   { fill: #e7f5e9; stroke: #93c79c; }
    .box    { stroke-width: 1.2; rx: 8; }
    .arrow  { stroke: #6b7280; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .dash   { stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0f1115; }
      .frame { stroke: #2a2f37; }
      .col   { fill: #9aa4b2; }
      .title { fill: #f3f4f6; }
      .body  { fill: #cbd5e1; }
      .edge  { fill: #9aa4b2; }
      .k8s   { fill: #172038; stroke: #3d5a9e; }
      .dp    { fill: #2a2113; stroke: #8a6a2f; }
      .cis   { fill: #102925; stroke: #3f8378; }
      .bigip { fill: #1a1d22; stroke: #4b535e; }
      .flow  { fill: #122417; stroke: #3d7a4b; }
      .arrow { stroke: #9aa4b2; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="470"/>
  <rect class="frame" x="12" y="12" width="1156" height="446" rx="10"/>

  <text class="col" x="40"  y="44">OPENSHIFT RESOURCES</text>
  <text class="col" x="500" y="44">F5 CIS CONTROLLER</text>
  <text class="col" x="830" y="44">BIG-IP + TRAFFIC PATH</text>

  <!-- ExternalLoadBalancer -->
  <rect class="box k8s" x="36" y="62" width="380" height="118"/>
  <text class="title" x="52" y="84">ExternalLoadBalancer  (gateway.nginx.org/v1alpha1)</text>
  <text class="body"  x="52" y="104">targetRefs: Gateway "gateway"  — one per Gateway</text>
  <text class="body"  x="52" y="121">gatewayLink.ipamLabel: Dev   (or virtualServerAddress)</text>
  <text class="body"  x="52" y="138">gatewayLink.partition: ocp   (exists, never Common, immutable)</text>
  <text class="body"  x="52" y="155">gatewayLink.iRules: /Common/Proxy_Protocol_iRule</text>
  <text class="body"  x="52" y="172">monitors: reference an EXISTING BIG-IP monitor only</text>

  <!-- NginxProxy -->
  <rect class="box k8s" x="36" y="196" width="380" height="112"/>
  <text class="title" x="52" y="218">NginxProxy  — not optional</text>
  <text class="body"  x="52" y="238">service.type: NodePort  → CIS can build pool members</text>
  <text class="body"  x="52" y="255">readinessProbe.expose: 8081 → real health checks</text>
  <text class="body"  x="52" y="272">rewriteClientIP: ProxyProtocol → real client IP</text>
  <text class="body"  x="52" y="289">trustedAddresses: BIG-IP self-IP + OVN join subnet</text>

  <!-- data plane service -->
  <rect class="box dp" x="36" y="324" width="380" height="86"/>
  <text class="title" x="52" y="346">gateway-nginx Service + NGINX data plane pods</text>
  <text class="body"  x="52" y="366">provisioned by the Gateway; ≥2 replicas advised</text>
  <text class="body"  x="52" y="383">its node ports become the BIG-IP pool members</text>
  <text class="body"  x="52" y="400">dual-stack nodes also add IPv6 members → monitor pools</text>

  <!-- CIS -->
  <rect class="box cis" x="470" y="150" width="250" height="150"/>
  <text class="title" x="486" y="172">F5 Container Ingress Services</text>
  <text class="body"  x="486" y="192">watches IngressLink (cis.f5.com/v1)</text>
  <text class="body"  x="486" y="209">custom_resource_mode: true</text>
  <text class="body"  x="486" y="226">pool_member_type: nodeport</text>
  <text class="body"  x="486" y="243">reads node IPs + NodePorts</text>
  <text class="body"  x="486" y="260">compiles an AS3 declaration</text>
  <text class="body"  x="486" y="277">posts it over iControl REST</text>

  <!-- IPAM -->
  <rect class="box cis" x="470" y="324" width="250" height="86"/>
  <text class="title" x="486" y="346">F5 IPAM Controller 0.1.13</text>
  <text class="body"  x="486" y="366">pool name → range (Dev, Test …)</text>
  <text class="body"  x="486" y="383">writes status.IPStatus via /status</text>
  <text class="body"  x="486" y="400">needs the corrected IPAM CRD</text>

  <!-- BIG-IP -->
  <rect class="box bigip" x="780" y="62" width="356" height="132"/>
  <text class="title" x="796" y="84">BIG-IP virtual server  (partition ocp, /ocp/Shared)</text>
  <text class="body"  x="796" y="104">VIP = IPAM address, e.g. 10.1.10.102:80</text>
  <text class="body"  x="796" y="121">pool = node IP : nodePort of gateway-nginx</text>
  <text class="body"  x="796" y="138">Proxy_Protocol_iRule attached to the virtual</text>
  <text class="body"  x="796" y="155">AS3 3.56.0 programs every object</text>
  <text class="body"  x="796" y="172">health monitor on the exposed readiness port</text>

  <!-- traffic path -->
  <rect class="box flow" x="780" y="238" width="356" height="112"/>
  <text class="title" x="796" y="260">client → BIG-IP VIP → node:nodePort → NGINX → coffee</text>
  <text class="body"  x="796" y="280">clients use the VIP, never a node port</text>
  <text class="body"  x="796" y="297">PROXY protocol carries the real client IP</text>
  <text class="body"  x="796" y="314">a request straight to the node port is rejected</text>
  <text class="body"  x="796" y="331">NGF/CIS keep the pool in sync as pods change</text>

  <!-- arrows -->
  <path class="arrow" d="M416,120 C446,120 452,180 470,196"/>
  <text class="edge" x="424" y="150">NGF emits an IngressLink</text>
  <text class="edge" x="424" y="166">named after the data plane Service</text>

  <path class="arrow dash" d="M416,360 C440,360 450,340 470,330"/>
  <text class="edge" x="424" y="392">pool members</text>

  <path class="arrow" d="M596,324 L596,302"/>
  <text class="edge" x="606" y="316">allocated address</text>

  <path class="arrow" d="M720,190 C750,190 760,150 780,132"/>
  <text class="edge" x="716" y="140">AS3 declaration</text>

  <path class="arrow" d="M958,194 L958,238"/>
</svg>
